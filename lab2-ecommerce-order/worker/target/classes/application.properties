# Application Configuration
spring.application.name=order-worker

# Camunda 8 Zeebe Client Configuration
# For Camunda 8 SaaS (Cloud)
# zeebe.client.cloud.cluster-id=your-cluster-id
# zeebe.client.cloud.client-id=your-client-id
# zeebe.client.cloud.client-secret=your-client-secret
# zeebe.client.cloud.region=bru-2

# For Camunda 8 Self-Managed (Local)
zeebe.client.broker.gateway-address=127.0.0.1:26500
zeebe.client.security.plaintext=true

# Worker Configuration
zeebe.client.worker.max-jobs-active=32
zeebe.client.worker.threads=2
zeebe.client.worker.default-name=order-worker
zeebe.client.worker.default-type=order-worker

# Job Worker Poll Interval
zeebe.client.job.timeout=10000
zeebe.client.job.poll-interval=100

# Server Configuration
server.port=8082

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.camunda.lab2=INFO
logging.level.io.camunda.zeebe=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
