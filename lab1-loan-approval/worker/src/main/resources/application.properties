spring.application.name=loan-worker

# Zeebe Broker Configuration
zeebe.client.broker.grpcAddress=localhost:26500
zeebe.client.broker.restAddress=http://localhost:8080
zeebe.client.security.plaintext=true

# Worker Configuration
zeebe.client.worker.default-type=loan-validation
zeebe.client.worker.default-name=loan-worker
zeebe.client.worker.threads=2

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.camunda=DEBUG
logging.level.com.camunda.lab1=DEBUG
logging.level.io.camunda.zeebe=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server Configuration
server.port=8081
