# Spring Boot Application Configuration
spring.application.name=appointment-worker

# Camunda 8 Zeebe Client Configuration
# For Camunda 8 SaaS (Cloud)
zeebe.client.cloud.cluster-id=${ZEEBE_CLUSTER_ID:your-cluster-id}
zeebe.client.cloud.client-id=${ZEEBE_CLIENT_ID:your-client-id}
zeebe.client.cloud.client-secret=${ZEEBE_CLIENT_SECRET:your-client-secret}
zeebe.client.cloud.region=${ZEEBE_REGION:bru-2}

# For Camunda 8 Self-Managed (uncomment and configure if using self-managed)
# zeebe.client.broker.gateway-address=${ZEEBE_GATEWAY_ADDRESS:localhost:26500}
# zeebe.client.security.plaintext=true

# Job Worker Configuration
zeebe.client.worker.max-jobs-active=32
zeebe.client.worker.threads=4
zeebe.client.worker.default-name=appointment-worker
zeebe.client.worker.default-type=appointment-worker

# Request timeout (in milliseconds)
zeebe.client.request-timeout=10000

# Logging Configuration
logging.level.root=INFO
logging.level.com.camunda.lab3=DEBUG
logging.level.io.camunda.zeebe=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Server Configuration (optional, for health checks)
server.port=8083
management.endpoints.web.exposure.include=health,info
